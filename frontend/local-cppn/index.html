<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2'></script>
    <!-- <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
    </script> -->
  <title>CPPN Demo</title>


</head>
<body>

  <h1>CPPN Interactive Demo</h1>
  <div class="container">
    <div class="controls">
      <h2>Input Scales</h2>
      <label for="inputX">X:</label>
      <input type="number" id="inputX" step="1" value="10">
      <br>
      <label for="inputY">Y:</label>
      <input type="number" id="inputY" step="1" value="10">
      <br><br>
      <label for="gridResolution">Grid Resolution (N):</label>
      <input type="range" id="gridResolution" min="1" max="1024" step="16" value="256">
      <span id="gridResolutionValue">256</span>
      <br><br>
      <button id="newBtn">New CPPN</button>
      <p class="output">Output: <span id="outputDisplay">---</span></p>
    </div>
    <canvas id="imageCanvas" width="1049" height="1049"></canvas>
    <br/>
    <canvas id="cppnCanvas" width="600" height="400"></canvas>
    <br/>
    <label for="targetPrompt"><br/>Target Prompt:</label>
    <input type="text" id="targetPrompt" value="A vibrant fractal pattern">
    <br>
    <button id="compareBtn">Compare Image</button>
    <button id="backpropBtn">Backprop</button>
<p id="similarityScore">Similarity: ---</p>

  </div>


  <script type="module">
    tf.setBackend('webgl');
    console.log(tf.getBackend());
    

    import { renderCPPNImages, setupGridRenderer, generateGrid, initializeCanvasControls } from './renderer.js';
    import { initializeCPPN, evaluate } from './cppn.js';
    // import {loadCLIPModels, evaluateImageSimilarity} from './clip.js';

    const gridResolutionValue = document.getElementById('gridResolutionValue');
    const gridResolutionInput = document.getElementById('gridResolution');
    const newBtn = document.getElementById('newBtn');
    const backpropBtn = document.getElementById('backpropBtn');
    const compareBtn = document.getElementById('compareBtn');

    import { computeSimilaritiesFromImages, computeSimilarities } from './clip.js';
    import { backprop } from './backprop.js';
    

    let imageData;
    let cppns;
    function update(){
        // Initialize the CPPN
        cppns = Array.from({ length: 10 }, () => initializeCPPN(3, [3, 2], 3));

        // Initialize canvas interactions
        initializeCanvasControls();
        
        // Set up image renderer with the initialized CPPN
        setupGridRenderer(gridResolutionInput, gridResolutionValue, newBtn, cppns);
        
        
        const res = parseInt(gridResolutionValue.textContent);
        // Render the initial image
        imageData = renderCPPNImages(cppns, res);
        
        
        // Evaluate the CPPN on the initial input
        // Read input range values
        const inputX = parseFloat(document.getElementById('inputX').value);
        const inputY = parseFloat(document.getElementById('inputY').value);
    
        // Generate grid tensors
        const { X, Y, R } = generateGrid(inputX, inputY, res);
    
        // Create input tensors for the CPPN (stacked inputs)
        const inputTensors = [X.flatten(), Y.flatten(), R.flatten()];
    
        backpropBtn.disabled = true;
        
    }
    update();

    function updateSim(){
        (async () => {
            const prompt = document.getElementById('targetPrompt').value;
            const res = parseInt(gridResolutionValue.textContent);
            //const similarities = await computeSimilaritiesFromImages(prompt, imageData);
            const similarities = await computeSimilarities(prompt, cppns, res);
            document.getElementById('similarityScore').textContent = `Similarity: ${similarities.map(s => s.toFixed(2)).join(', ')}`;
        })();
    }
    
    updateSim();
    
    backpropBtn.disabled = false;
    function backpropClicked(){
        backpropBtn.disabled = true;
        const prompt = document.getElementById('targetPrompt').value;
        const res = parseInt(gridResolutionValue.textContent);
        console.log("starting backprop with prompt: \"", prompt, "\" and res: ", res);
        backprop(prompt, cppns, res);
        backpropBtn.disabled = false;

    }

    newBtn.addEventListener('click', update);

    backpropBtn.addEventListener('click', backpropClicked);

    compareBtn.addEventListener("click", updateSim);
    
  </script>
  
</body>
</html>
